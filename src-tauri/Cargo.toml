[package]
name = "shelfledger"
version = "0.3.0"
description = "Local-first personal library, reading journal, and copy ledger"
authors = ["ShelfLedger contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "shelfledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "shelfledger"
path = "src/main.rs"

# Web version: same core served to a browser over loopback HTTP.
[[bin]]
name = "shelfledger-web"
path = "src/web_main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "migrate", "chrono"] }
sqlx-sqlite = { version = "=0.8.6", features = ["bundled", "migrate", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = { version = "0.24", default-features = false }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
csv = "1"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
axum = { version = "0.8", features = ["json"] }

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

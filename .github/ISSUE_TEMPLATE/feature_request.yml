name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Product principles
      description: ShelfLedger is local-first and offline-first. Ideas that fit this get priority.
      options:
        - label: This works offline / keeps data local
  - type: checkboxes
    id: phase
    attributes:
      label: Roadmap fit
      options:
        - label: I checked docs/implementation.md and this is not already planned

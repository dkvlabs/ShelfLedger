name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry_tag:
        description: 'Build installers for an existing release (for example v0.1.1); empty updates the release PR'
        required: false
        type: string
      repair_published:
        description: Add missing installers to a public release without replacing existing binaries
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_ROOT: ${{ github.workspace }}

# A new push must not cancel installers or publishing for an earlier release.
concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.retry_tag == '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@v4.4.1
        id: release
        with:
          # Optional fine-grained token for PR CI without manual approval.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare:
    needs: release-please
    # GitHub exposes draft releases only to callers with push access.
    permissions:
      contents: write
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.release-please.outputs.created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.retry_tag != ''))
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      release_id: ${{ steps.release.outputs.release_id }}
      allow_published: ${{ steps.release.outputs.allow_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - name: Resolve the release and immutable source commit
        id: release
        uses: actions/github-script@v7
        env:
          RETRY_TAG: ${{ inputs.retry_tag }}
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
          REPAIR_PUBLISHED: ${{ inputs.repair_published }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { prepareRelease } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release-github.mjs`).href);
            const { owner, repo } = context.repo;
            const tag = process.env.RETRY_TAG;
            if (tag && !/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) {
              throw new Error('Retry tag must be a stable version such as v0.1.0');
            }
            let release;
            if (tag) {
              const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
              release = releases.find(item => item.tag_name === tag);
            } else {
              release = (await github.rest.repos.getRelease({ owner, repo, release_id: Number(process.env.RELEASE_ID) })).data;
            }
            if (!release) throw new Error('Release not found');
            const prepared = prepareRelease(release, tag || release.tag_name, process.env.REPAIR_PUBLISHED === 'true');
            const commit = await github.rest.repos.getCommit({ owner, repo, ref: `tags/${release.tag_name}` });
            core.setOutput('sha', commit.data.sha);
            for (const [key, value] of Object.entries(prepared)) core.setOutput(key, value);

  checks:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # Use the fixed packaging helpers from this workflow commit, while all
      # application code and dependency locks remain at the immutable tag SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/workflows/release.yml
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .release-tools/scripts/release.mjs check
      - run: node --test .release-tools/scripts/release.test.mjs .release-tools/scripts/release-github.test.mjs
      - run: pnpm lint
      - run: pnpm test:web
      - name: Validate the release description before building
        run: node .release-tools/scripts/release.mjs notes

  installers:
    needs: [prepare, checks]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.checks.result == 'success' }}
    name: Installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
          - platform: macos-x64
            os: macos-15
          - platform: windows-x64
            os: windows-2022
          - platform: linux-arm64
            os: ubuntu-22.04-arm
          - platform: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # Use the fixed packaging helpers from this workflow commit, while all
      # application code and dependency locks remain at the immutable tag SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/workflows/release.yml
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: node .release-tools/scripts/release.mjs check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build installers
        run: node .release-tools/scripts/release.mjs build "$RELEASE_PLATFORM"
        shell: bash
        env:
          SHELFLEDGER_GOOGLE_CLIENT_ID: ${{ vars.SHELFLEDGER_GOOGLE_CLIENT_ID }}
          SHELFLEDGER_GOOGLE_CLIENT_SECRET: ${{ secrets.SHELFLEDGER_GOOGLE_CLIENT_SECRET }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Stage versioned installers
        run: node .release-tools/scripts/release.mjs stage "$RELEASE_PLATFORM"
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, installers]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.installers.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      # Carry preparation's authorization for this exact release. It may become
      # public while installers are building, even on a push without inputs.
      ALLOW_PUBLISHED: ${{ needs.prepare.outputs.allow_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # Use the fixed packaging helpers from this workflow commit, while all
      # application code and dependency locks remain at the immutable tag SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/workflows/release.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Require every installer and generate SHA-256 checksums
        run: node .release-tools/scripts/release.mjs checksums
      - name: Generate categorized notes and download links
        run: node .release-tools/scripts/release.mjs notes
      - name: Upload installers and complete the release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { publishRelease } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.release-tools/scripts/release-github.mjs`).href);
            const names = await publishRelease({
              github, ...context.repo,
              releaseId: process.env.RELEASE_ID,
              tag: process.env.RELEASE_TAG,
              sha: process.env.RELEASE_SHA,
              directory: 'release-assets',
              notes: fs.readFileSync('release-notes.md', 'utf8'),
              allowPublished: process.env.ALLOW_PUBLISHED === 'true',
            });
            core.notice(`Completed ${process.env.RELEASE_TAG} with ${names.length} assets`);
